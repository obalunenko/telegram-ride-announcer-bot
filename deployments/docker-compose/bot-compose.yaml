services:
  server:
    image: ${RIDE_ANNOUNCER_IMAGE}
    environment:
      RIDE_ANNOUNCER_TELEGRAM_TOKEN: ${RIDE_ANNOUNCER_TELEGRAM_TOKEN:-""}
      RIDE_ANNOUNCER_LOG_LEVEL: ${RIDE_ANNOUNCER_LOG_LEVEL:-DEBUG}
      RIDE_ANNOUNCER_LOG_FORMAT: ${RIDE_ANNOUNCER_LOG_FORMAT:-text}
      RIDE_ANNOUNCER_TIMEZONE: ${RIDE_ANNOUNCER_TIMEZONE:-UTC}
